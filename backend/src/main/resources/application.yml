# FoodWise backend configuration. Secrets come ONLY from environment variables (SYSTEM_DESIGN 10.6).
spring:
  application:
    name: foodwise
  profiles:
    default: dev
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/foodwise}
    username: ${DATABASE_USERNAME:foodwise}
    password: ${DATABASE_PASSWORD:foodwise}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway, never by Hibernate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    validate-on-migrate: true
    out-of-order: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: always
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      base-path: /api/v1
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api/docs/openapi.json
  swagger-ui:
    path: /api/docs

foodwise:
  timezone: ${FOODWISE_TIMEZONE:Asia/Kolkata}
  allowed-origins: ${FRONTEND_URL:http://localhost:3000}
  auth:
    mode: ${AUTH_MODE:CLERK}
    clerk:
      jwks-uri: ${CLERK_JWKS_URI:}
      issuer: ${CLERK_ISSUER:}
      authorized-parties: ${CLERK_AUTHORIZED_PARTIES:}
      webhook-secret: ${CLERK_WEBHOOK_SECRET:}
      secret-key: ${CLERK_SECRET_KEY:}
    dev:
      jwt-secret: ${DEV_JWT_SECRET:change-me-dev-only-secret-at-least-32-bytes-long!!}
  scan:
    storage-dir: ${SCAN_STORAGE_DIR:./data/uploads}
    tessdata-path: ${TESSDATA_PATH:}
    ocr-language: ${OCR_LANGUAGE:eng}
    haul-model-path: ${HAUL_MODEL_PATH:}
    haul-labels-path: ${HAUL_LABELS_PATH:}
    max-scans-per-hour: ${MAX_SCANS_PER_HOUR:20}
  scheduler:
    enabled: ${SCHEDULER_ENABLED:true}
